worker_processes auto;
rtmp_auto_push on;
events {}
rtmp {
    server {
        listen 1935;
        listen [::]:1935 ipv6only=on;

        application live {
            live on;
            record off;
            
            # Auth webhook. Nginx passes name=<stream_key>
            # host.docker.internal works on Docker Desktop (Windows/Mac)
            on_publish http://host.docker.internal:8080/api/v1/live/webhook/publish;
            on_publish_done http://host.docker.internal:8080/api/v1/live/webhook/done;

            # Enable HLS
            hls on;
            hls_path /tmp/hls;
            hls_fragment 4;
            hls_playlist_length 20;
            
            # Cleanup old fragments
            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8088;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            
            # CORS setup for frontend access
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS';
            add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept';
            
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                add_header Access-Control-Allow-Methods 'GET, OPTIONS';
                add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept';
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }
    }
}
