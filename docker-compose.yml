version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: seamlis_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seamlis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seamlis_local_pass}
      POSTGRES_DB: ${POSTGRES_DB:-seamlis}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-seamlis}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: seamlis_redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: seamlis_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/seamlis-media --ignore-existing;
      /usr/bin/mc mb myminio/seamlis-raw --ignore-existing;
      /usr/bin/mc anonymous set download myminio/seamlis-media;
      "

  video-worker:
    image: jrottenberg/ffmpeg:4.4-alpine
    container_name: seamlis_video_worker
    entrypoint: ["sh", "-c", "echo 'Video worker ready' && tail -f /dev/null"]
    volumes:
      - miniodata:/data
    depends_on:
      - minio
      - redis

volumes:
  pgdata:
  redisdata:
  miniodata:
